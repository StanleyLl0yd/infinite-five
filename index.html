<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta id="metaDescription" name="description" content="Infinite Five — five in a row on an infinite board." />
    <link rel="icon" href="/infinite-five/icon.svg" type="image/svg+xml" />
    <title>Infinite Five</title>
  </head>
  <body>
    <div id="app">
      <header class="topbar">
        <div class="brand" aria-label="Infinite Five">
          <span class="brand-symbol">∞5</span>
          <span class="brand-name">Infinite Five</span>
        </div>
        <div id="status" class="status" aria-live="polite">Your turn</div>
        <div class="actions">
          <button id="centerButton" type="button">Center</button>
          <button id="undoButton" type="button">Undo</button>
          <button id="themeButton" type="button">Theme</button>
          <button id="newGameButton" type="button" class="primary">New game</button>
        </div>
      </header>
      <main class="game-shell">
        <section class="game-info">
          <div class="game-info-copy">
            <h1 id="gameInfoTitle">Five in a row on an infinite board</h1>
            <p id="gameInfoRules">
              X moves first. Be the first to make 5 or more of your marks in one horizontal,
              vertical or diagonal line. Drag the board to move it and use the mouse wheel or
              pinch to zoom.
            </p>
          </div>
          <div class="game-options" aria-label="Game options">
            <label class="option-field">
              <span id="modeLabel">Game mode</span>
              <select id="modeSelect">
                <option id="modeAiOption" value="ai">Vs computer</option>
                <option id="modeLocalOption" value="local">Two players</option>
              </select>
            </label>
            <label id="difficultyField" class="option-field">
              <span id="difficultyLabel">Difficulty</span>
              <select id="difficultySelect">
                <option id="difficultyEasyOption" value="easy">Easy</option>
                <option id="difficultyMediumOption" value="medium">Medium</option>
                <option id="difficultyHardOption" value="hard">Hard</option>
              </select>
            </label>
            <div id="stats" class="stats" aria-live="polite">AI: 0 wins · 0 losses</div>
          </div>
        </section>
        <div class="board-shell">
          <canvas id="board" aria-label="Infinite Five game board"></canvas>
        </div>
      </main>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
