name: Refresh v0.6.2 lock metadata

on:
  pull_request:
    branches: [main]
    paths:
      - .github/workflows/refresh-v062-locks.yml
      - package.json
      - src-tauri/Cargo.toml

permissions:
  contents: write

jobs:
  refresh:
    if: github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout PR head
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref }}
          persist-credentials: true
      - name: Refresh npm root version metadata
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const packageJson = JSON.parse(fs.readFileSync('package.json', 'utf8'));
          const lock = JSON.parse(fs.readFileSync('package-lock.json', 'utf8'));
          lock.version = packageJson.version;
          lock.packages[''].version = packageJson.version;
          fs.writeFileSync('package-lock.json', `${JSON.stringify(lock, null, 2)}\n`);
          NODE
      - name: Refresh native Cargo lock metadata
        run: cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 --no-deps >/dev/null
      - name: Commit refreshed lock metadata
        run: |
          if git diff --quiet -- package-lock.json src-tauri/Cargo.lock; then
            exit 0
          fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add package-lock.json src-tauri/Cargo.lock
          git commit -m "Sync v0.6.2 lock metadata"
          git push origin "HEAD:${{ github.head_ref }}"
