name: RuStore Screenshots v0.6.3 Temp

on:
  push:
    branches:
      - tooling/rustore-screenshots-v063-temp
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: rustore-screenshots-v063-temp
  cancel-in-progress: true

jobs:
  screenshots:
    name: Capture signed v0.6.3 APK
    runs-on: ubuntu-24.04
    timeout-minutes: 35

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Capture published v0.6.3 in Android emulator
        uses: reactivecircus/android-emulator-runner@a421e43855164a8197daf9d8d40fe71c6996bb0d
        env:
          GH_TOKEN: ${{ github.token }}
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_6
          cores: 2
          ram-size: 4096
          disable-animations: true
          emulator-options: -no-window -no-snapshot -noaudio -no-boot-anim -gpu swiftshader_indirect -camera-back none -camera-front none -no-metrics
          script: bash .github/scripts/capture-rustore-v063-temp.sh

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: Infinite-Five-RuStore-screenshots-v0.6.3
          path: capture/
          if-no-files-found: warn
          retention-days: 14
