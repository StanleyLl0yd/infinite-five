name: Post-release Docs Temp

on:
  push:
    branches:
      - docs/v0.5.4-post-release
    paths:
      - .github/workflows/post-release-docs-temp.yml

permissions:
  contents: write

jobs:
  update:
    if: github.event.head_commit.message == 'Add temporary v0.5.4 documentation sync'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: docs/v0.5.4-post-release

      - name: Update post-release documentation
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str):
              p = Path(path)
              text = p.read_text()
              if old not in text:
                  raise SystemExit(f'Expected text not found in {path}: {old[:120]!r}')
              p.write_text(text.replace(old, new, 1))

          # README.md
          replace_once('README.md',
              'source-0.5.2-16A34A',
              'source-0.5.4-16A34A')
          replace_once('README.md',
              'Current published release: **v0.5.2** · Web + PWA · GitHub Pages + signed native release artifacts. v0.5.2 includes the repository-wide audit and refactor, hardened immutable-source release verification, a RuStore-ready Android production manifest, store/privacy documentation, signed APK/AAB packaging, and an ad-hoc signed universal macOS DMG. Android publication through RuStore is the active distribution step. Google Play and App Store remain planned until the required developer access is available; macOS Developer ID signing/notarization also remains pending Apple signing access.',
              'Current published release: **v0.5.4** · Web + PWA · GitHub Pages + signed native release artifacts. v0.5.3 added the localized About dialog and synchronized application version presentation. v0.5.4 hardens Android for current Google Play requirements with `minSdk 26`, `targetSdk 36`, `compileSdk 36`, pinned NDK r29, an AAB-first signed release flow, ARM-only release packages (`arm64-v8a` + `armeabi-v7a`), and enforced 16 KB page-size compatibility checks. Android publication through RuStore remains the active distribution step. Google Play and App Store remain planned until the required developer access is available; macOS Developer ID signing/notarization also remains pending Apple signing access.')
          replace_once('README.md',
              '- signed Android APK/AAB release packaging from GitHub Secrets with certificate and package-identity verification;',
              '- signed Android AAB-first release packaging from GitHub Secrets with certificate/package verification, `arm64-v8a` + `armeabi-v7a`, and enforced 16 KB native compatibility;\n- supplemental signed APK packaging for direct installation and GitHub releases;')
          replace_once('README.md',
              '- Android APK and universal macOS DMG package-build verification for native changes;',
              '- Android AAB/APK and universal macOS DMG package-build verification for native changes;')
          replace_once('README.md',
              'Release packaging additionally verifies Android signatures and `com.sl.infinitefive`, produces signed APK/AAB files plus an ad-hoc signed universal macOS DMG, generates SHA-256 checksums, and attaches the files to the matching GitHub Release.',
              'Release packaging additionally verifies Android signatures, `com.sl.infinitefive`, SDK levels, release ABIs, ELF 16 KB LOAD alignment, APK 16 KB zip alignment, and AAB `PAGE_ALIGNMENT_16K`; it publishes the signed AAB as the primary Android artifact, a supplemental signed APK, an ad-hoc signed universal macOS DMG, and SHA-256 checksums to the matching GitHub Release.')
          replace_once('README.md',
              'Completed in **v0.5.2**: full repository audit/refactor, release-source hardening, RuStore-oriented Android manifest minimization, synchronized release metadata, publication checklist, privacy policy, application terms, and the first RuStore release candidate.\n\nNext priorities:\n\n- complete RuStore AAB signing enrollment, real-device release smoke testing, store media/forms, and submit v0.5.2 for moderation;',
              'Completed in **v0.5.2**: full repository audit/refactor, release-source hardening, RuStore-oriented Android manifest minimization, synchronized release metadata, publication checklist, privacy policy, application terms, and the first RuStore release candidate.\n\nCompleted in **v0.5.3**: compact localized About UI with application version, developer, GitHub, privacy-policy and terms links.\n\nCompleted in **v0.5.4**: Android 8.0+ baseline (`minSdk 26`), API 36 target/compile baseline, pinned NDK r29, AAB-first signed releases, ARM-only production ABI set, and mandatory 16 KB ELF/APK/AAB compatibility gates.\n\nNext priorities:\n\n- complete RuStore AAB signing enrollment, real-device release smoke testing, store media/forms, and submit v0.5.4 for moderation;')

          # README_RU.md
          replace_once('README_RU.md',
              'source-0.5.2-16A34A',
              'source-0.5.4-16A34A')
          replace_once('README_RU.md',
              'Текущий опубликованный релиз: **v0.5.2** · Web + PWA · GitHub Pages + подписанные нативные release-файлы. В v0.5.2 вошли полный аудит и рефакторинг репозитория, усиленная проверка неизменяемого release-исходника, минимизированный production manifest Android для RuStore, документы для публикации и конфиденциальности, подписанные APK/AAB и ad-hoc подписанный universal DMG для macOS. Активный этап распространения — публикация Android в RuStore. Google Play и App Store остаются в планах до появления необходимого developer-доступа; Developer ID signing/notarization для macOS также ждёт Apple-доступа.',
              'Текущий опубликованный релиз: **v0.5.4** · Web + PWA · GitHub Pages + подписанные нативные release-файлы. В v0.5.3 добавлено локализованное окно About с версией приложения, разработчиком и ссылками на GitHub/политику/условия. В v0.5.4 Android приведён к актуальной базе Google Play: `minSdk 26`, `targetSdk 36`, `compileSdk 36`, закреплён NDK r29, AAB сделан основным подписанным release-форматом, production ABI ограничены `arm64-v8a` + `armeabi-v7a`, а совместимость с 16 KB memory pages проверяется автоматически. Активный этап распространения — публикация Android в RuStore. Google Play и App Store остаются в планах до появления необходимого developer-доступа; Developer ID signing/notarization для macOS также ждёт Apple-доступа.')
          replace_once('README_RU.md',
              '- release-сборка подписанных Android APK/AAB из GitHub Secrets с проверкой сертификата и Application ID;',
              '- AAB-first release-сборка Android из GitHub Secrets с проверкой сертификатов/Application ID, `arm64-v8a` + `armeabi-v7a` и обязательной 16 KB native-совместимостью;\n- дополнительный подписанный APK для прямой установки и GitHub Releases;')
          replace_once('README_RU.md',
              '- проверка сборки Android APK и universal macOS DMG для нативных изменений;',
              '- проверка сборки Android AAB/APK и universal macOS DMG для нативных изменений;')
          replace_once('README_RU.md',
              'Release workflow дополнительно проверяет подписи Android и `com.sl.infinitefive`, собирает подписанные APK/AAB и ad-hoc подписанный universal DMG, формирует SHA-256 checksums и прикладывает файлы к соответствующему GitHub Release.',
              'Release workflow дополнительно проверяет подписи Android, `com.sl.infinitefive`, SDK levels, ABI, ELF LOAD alignment не менее 16 KB, APK zip alignment 16 KB и AAB `PAGE_ALIGNMENT_16K`; основным Android-артефактом публикуется подписанный AAB, дополнительным — подписанный APK, вместе с ad-hoc подписанным universal DMG и SHA-256 checksums.')
          replace_once('README_RU.md',
              'В **v0.5.2** завершены: полный аудит/рефакторинг репозитория, усиление release-source verification, минимизация Android manifest для RuStore, синхронизация release-метаданных, checklist публикации, политика конфиденциальности, пользовательские условия и первый RuStore release candidate.\n\nСледующие приоритеты:\n\n- завершить RuStore AAB signing enrollment, smoke-тест release-сборки на реальном устройстве, подготовить медиаматериалы/формы и отправить v0.5.2 на модерацию;',
              'В **v0.5.2** завершены: полный аудит/рефакторинг репозитория, усиление release-source verification, минимизация Android manifest для RuStore, синхронизация release-метаданных, checklist публикации, политика конфиденциальности, пользовательские условия и первый RuStore release candidate.\n\nВ **v0.5.3** завершены: компактная локализованная кнопка/панель About с версией приложения, разработчиком и ссылками на GitHub, политику конфиденциальности и условия использования.\n\nВ **v0.5.4** завершены: Android 8.0+ (`minSdk 26`), target/compile API 36, NDK r29, AAB-first release pipeline, ARM-only production ABI и обязательные проверки совместимости ELF/APK/AAB с 16 KB memory pages.\n\nСледующие приоритеты:\n\n- завершить RuStore AAB signing enrollment, smoke-тест release-сборки на реальном устройстве, подготовить медиаматериалы/формы и отправить v0.5.4 на модерацию;')

          # docs/PRODUCT.md
          replace_once('docs/PRODUCT.md', 'Current published release: **v0.5.2**.', 'Current published release: **v0.5.4**.')
          replace_once('docs/PRODUCT.md',
              'Release v0.5.0 established the cross-platform Tauri foundation and native build verification. Release v0.5.1 added secret-backed Android signing, verified APK/AAB packaging, an ad-hoc signed universal macOS DMG, checksums, and native asset attachment. Release v0.5.2 adds the repository-wide audit/refactor, immutable release-source verification, RuStore-oriented Android permission minimization, synchronized version metadata, privacy/application terms, and the first RuStore publication package. Android through RuStore is the active public native distribution target. Google Play and App Store remain planned until developer access is available. macOS direct distribution remains supported, with Developer ID signing/notarization pending Apple signing access. Windows and Linux may be evaluated later without changing the shared game implementation.',
              'Release v0.5.0 established the cross-platform Tauri foundation and native build verification. Release v0.5.1 added secret-backed Android signing, verified APK/AAB packaging, an ad-hoc signed universal macOS DMG, checksums, and native asset attachment. Release v0.5.2 added the repository-wide audit/refactor, immutable release-source verification, RuStore-oriented Android permission minimization, synchronized version metadata, privacy/application terms, and the first RuStore publication package. Release v0.5.3 added a compact localized About surface with version/developer/legal links. Release v0.5.4 hardens Android to `minSdk 26`, target/compile API 36, pinned NDK r29, an AAB-first signed release flow, ARM-only production ABIs (`arm64-v8a` + `armeabi-v7a`), and mandatory 16 KB ELF/APK/AAB compatibility verification. Android through RuStore is the active public native distribution target. Google Play and App Store remain planned until developer access is available. macOS direct distribution remains supported, with Developer ID signing/notarization pending Apple signing access. Windows and Linux may be evaluated later without changing the shared game implementation.')
          replace_once('docs/PRODUCT.md',
              'Unsigned CI APK/DMG builds remain packaging-compatibility signals. Release APK/AAB files are signed and certificate-verified from GitHub Secrets; the current universal macOS DMG is ad-hoc signed and is not Developer ID notarized.',
              'Unsigned CI AAB/APK/DMG builds remain packaging-compatibility signals. Release Android packages are signed and certificate-verified from GitHub Secrets, with the AAB treated as the primary store artifact and the APK as supplemental direct-install output. The Android pipeline also verifies the release ABI set and 16 KB native packaging compatibility. The current universal macOS DMG is ad-hoc signed and is not Developer ID notarized.')
          replace_once('docs/PRODUCT.md',
              '11. RuStore release preparation, Android manifest hardening, privacy/terms and publication package. Completed in v0.5.2.\n12. RuStore console signing enrollment, real-device validation and publication.\n13. macOS direct-distribution packaging with Developer ID signing/notarization when available.\n14. Google Play and iOS/App Store distribution when the required developer access is available.\n15. Optional room-link online multiplayer across supported platforms.\n16. Ongoing repository maintenance, dependency review and measured performance/AI follow-up.',
              '11. RuStore release preparation, Android manifest hardening, privacy/terms and publication package. Completed in v0.5.2.\n12. Localized About UI with version/developer/legal links. Completed in v0.5.3.\n13. Android API 26/36 baseline, pinned NDK r29, AAB-first release packaging, ARM-only production ABIs and 16 KB compatibility gates. Completed in v0.5.4.\n14. RuStore console signing enrollment, real-device validation and publication.\n15. macOS direct-distribution packaging with Developer ID signing/notarization when available.\n16. Google Play and iOS/App Store distribution when the required developer access is available.\n17. Optional room-link online multiplayer across supported platforms.\n18. Ongoing repository maintenance, dependency review and measured performance/AI follow-up.')

          # docs/CROSS_PLATFORM.md
          replace_once('docs/CROSS_PLATFORM.md',
              'Release v0.5.0 established the Tauri cross-platform foundation and native build validation. Release v0.5.1 added the signed native release pipeline. Release v0.5.2 hardens release-source verification, minimizes the production Android manifest for RuStore, synchronizes version metadata, and adds the store publication/privacy package. RuStore submission is now the active Android distribution step; Google Play and App Store remain deferred until developer access is available, while macOS Developer ID notarization still requires Apple signing access.',
              'Release v0.5.0 established the Tauri cross-platform foundation and native build validation. Release v0.5.1 added the signed native release pipeline. Release v0.5.2 hardened release-source verification, minimized the production Android manifest for RuStore, synchronized version metadata, and added the store publication/privacy package. Release v0.5.3 added the localized About surface. Release v0.5.4 moves Android to `minSdk 26`, target/compile API 36 and NDK r29, makes the signed AAB the primary Android release artifact, restricts production packages to `arm64-v8a` + `armeabi-v7a`, and enforces 16 KB native package compatibility. RuStore submission is the active Android distribution step; Google Play and App Store remain deferred until developer access is available, while macOS Developer ID notarization still requires Apple signing access.')
          replace_once('docs/CROSS_PLATFORM.md',
              'Release APKs and AABs are produced only from the tagged release source. The APK uses the application-signing alias. The AAB uses the upload-key alias expected by the store workflow. Both aliases may live in the same Java keystore, while keeping the logical keys separate is preferred. The release workflow verifies certificate SHA-256 fingerprints before building and verifies the resulting APK/AAB signatures before publishing artifacts.',
              'Release AABs and supplemental APKs are produced only from the tagged release source. The AAB is the primary store artifact and uses the upload-key alias expected by the store workflow; the APK is supplemental direct-install output and uses the application-signing alias. Android production packages contain only `arm64-v8a` and `armeabi-v7a`. The project baseline is `minSdk 26`, `targetSdk 36`, `compileSdk 36`, with NDK `29.0.14206865`. The release workflow verifies certificate SHA-256 fingerprints before building, verifies the resulting signatures, and rejects artifacts that fail the expected ABI set, 16 KB ELF LOAD alignment, APK 16 KB zip alignment, or AAB `PAGE_ALIGNMENT_16K` checks.')
          replace_once('docs/CROSS_PLATFORM.md',
              'Release v0.5.2 continues to produce a universal Apple Silicon + Intel DMG with an ad-hoc signature.',
              'Release v0.5.4 continues to produce a universal Apple Silicon + Intel DMG with an ad-hoc signature.')
          replace_once('docs/CROSS_PLATFORM.md',
              'Infinite-Five-v<version>-Android.apk\nInfinite-Five-v<version>-Android.aab',
              'Infinite-Five-v<version>-Android.aab\nInfinite-Five-v<version>-Android.apk')
          replace_once('docs/CROSS_PLATFORM.md',
              '- signing and update behavior for the intended distribution channel.',
              '- signing and update behavior for the intended distribution channel;\n- Android release ABI shape and 16 KB ELF/APK/AAB compatibility when Android is targeted.')

          # docs/RUSTORE.md
          replace_once('docs/RUSTORE.md',
              'Infinite Five v0.5.2 is the first RuStore release candidate. The signed GitHub Release is published from source commit `292dea7669e0ce439fa6ae95de214c14a7a5ef1d`; its APK, AAB and universal macOS DMG have passed the controlled release workflow and are attached together with SHA-256 checksums. The Android application uses the stable package identity `com.sl.infinitefive`.',
              'Infinite Five v0.5.4 is the current RuStore release candidate. The signed GitHub Release is published from source commit `f8630060c466cca31c4733adb2ef550146393e78`; its primary Android AAB, supplemental APK and universal macOS DMG have passed the controlled release workflow and are attached together with SHA-256 checksums. The Android application uses the stable package identity `com.sl.infinitefive`.')
          replace_once('docs/RUSTORE.md',
              'The published v0.5.2 release contains:',
              'The published v0.5.4 release contains:')
          replace_once('docs/RUSTORE.md',
              'Infinite-Five-v0.5.2-Android.apk\nInfinite-Five-v0.5.2-Android.aab\nInfinite-Five-v0.5.2-macOS-universal.dmg',
              'Infinite-Five-v0.5.4-Android.aab\nInfinite-Five-v0.5.4-Android.apk\nInfinite-Five-v0.5.4-macOS-universal.dmg')
          replace_once('docs/RUSTORE.md',
              '75f640c9c9867272c991330455a24e973afa3d493c76f3455543da688f45bfe0  Infinite-Five-v0.5.2-Android.aab\n00104b25c9507541c6fe7b29704ae721a6c4bbb851f82ab8e4373a5a7084e627  Infinite-Five-v0.5.2-Android.apk\n5cc49aa2373a90d06077bbfdf83271581f954dff31f9889530506481360437c4  Infinite-Five-v0.5.2-macOS-universal.dmg',
              '762fea5faa04b9adc4f84b03841a6b6475e2f9c5d15297aafed2d4bf7d35596c  Infinite-Five-v0.5.4-Android.aab\nc330f65780ba667d4e35d80bd5bd1c23153b843d341f1a9b439bde74695f0fee  Infinite-Five-v0.5.4-Android.apk\ne8628e3609ec8c564fa59f971919a709a9bb69d1b85047a4701ff95c3858cb53  Infinite-Five-v0.5.4-macOS-universal.dmg')
          replace_once('docs/RUSTORE.md',
              '6. Upload `Infinite-Five-v0.5.2-Android.aab`, which the release workflow signs with that upload key.',
              '6. Upload `Infinite-Five-v0.5.4-Android.aab`, which the release workflow signs with that upload key.')
          replace_once('docs/RUSTORE.md',
              '### Version 0.5.2 release notes\n\nПодготовлен первый релиз-кандидат для RuStore. Обновлена и дополнительно проверена Android-сборка, сокращены разрешения релизного приложения, усилена надёжность подписанного APK/AAB release pipeline и включены последние оптимизации игрового кода.',
              '### Version 0.5.4 release notes\n\nAndroid-сборка приведена к актуальной базе Google Play: Android 8.0+, target/compile API 36, NDK r29, основной подписанный AAB и ARM-only release package. Добавлены обязательные проверки совместимости с 16 KB memory pages. В предыдущем v0.5.3 также добавлено локализованное окно «О приложении».')
          replace_once('docs/RUSTORE.md',
              'Mobile screenshots are mandatory. Use real screenshots captured from the v0.5.2 release candidate rather than mockups or generated promotional screens.',
              'Mobile screenshots are mandatory. Use real screenshots captured from the v0.5.4 release candidate rather than mockups or generated promotional screens.')
          replace_once('docs/RUSTORE.md',
              '5. Local history or replay view.',
              '5. About dialog with version, developer and legal links.')
          replace_once('docs/RUSTORE.md',
              '- GitHub Release `v0.5.2` tag resolves to the exact release source commit.\n- CI, CodeQL, Security and Native Release workflows are green.\n- `Infinite-Five-v0.5.2-Android.apk`, `Infinite-Five-v0.5.2-Android.aab`, `Infinite-Five-v0.5.2-macOS-universal.dmg` and `SHA256SUMS.txt` are attached to the release.\n- APK and AAB signatures match the expected certificates.\n- Package name is `com.sl.infinitefive`.\n- `versionName` is `0.5.2` and Android `versionCode` is higher than v0.5.1.',
              '- GitHub Release `v0.5.4` tag resolves to source commit `f8630060c466cca31c4733adb2ef550146393e78`.\n- CI, CodeQL, Security and Native Release workflows are green.\n- `Infinite-Five-v0.5.4-Android.aab`, `Infinite-Five-v0.5.4-Android.apk`, `Infinite-Five-v0.5.4-macOS-universal.dmg` and `SHA256SUMS.txt` are attached to the release.\n- APK and AAB signatures match the expected certificates.\n- Package name is `com.sl.infinitefive`.\n- `versionName` is `0.5.4` and Android `versionCode` is higher than v0.5.3.\n- Android baseline is `minSdk 26`, `targetSdk 36`, `compileSdk 36`, NDK r29.\n- Release packages contain `arm64-v8a` and `armeabi-v7a` only, with `arm64-v8a` present.\n- ELF, APK and AAB 16 KB compatibility gates pass.')
          replace_once('docs/RUSTORE.md',
              'RuStore In-App Updates is optional for the first publication and is intentionally not a blocker for v0.5.2.',
              'RuStore In-App Updates is optional for the first publication and is intentionally not a blocker for v0.5.4.')

          # Add explicit Android compatibility section before AAB enrollment.
          marker = '## AAB signing enrollment\n'
          p = Path('docs/RUSTORE.md')
          text = p.read_text()
          if marker not in text:
              raise SystemExit('AAB enrollment marker missing')
          section = '''## Android release compatibility\n\nThe v0.5.4 Android release baseline is:\n\n- `minSdk 26` (Android 8.0+);\n- `targetSdk 36`;\n- `compileSdk 36`;\n- NDK `29.0.14206865`;\n- production ABIs: `arm64-v8a` and `armeabi-v7a`;\n- signed AAB as the primary store artifact;\n- signed APK only as supplemental direct-install/GitHub output.\n\nThe release pipeline treats 16 KB page-size support as a blocking artifact gate. It verifies every packaged 64-bit native library for ELF LOAD alignment of at least `0x4000`, validates the APK with 16 KB zip alignment, and requires `PAGE_ALIGNMENT_16K` in the AAB. Any future JNI/native dependency that breaks those guarantees must fail CI before publication.\n\n'''
          p.write_text(text.replace(marker, section + marker, 1))
          PY

          rm .github/workflows/post-release-docs-temp.yml

      - name: Verify documentation state
        shell: bash
        run: |
          grep -q 'source-0.5.4-16A34A' README.md
          grep -q 'source-0.5.4-16A34A' README_RU.md
          grep -q 'Current published release: \*\*v0.5.4\*\*' docs/PRODUCT.md
          grep -q 'PAGE_ALIGNMENT_16K' docs/CROSS_PLATFORM.md
          grep -q '762fea5faa04b9adc4f84b03841a6b6475e2f9c5d15297aafed2d4bf7d35596c' docs/RUSTORE.md
          test ! -e .github/workflows/post-release-docs-temp.yml

      - name: Commit documentation update
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add README.md README_RU.md docs/PRODUCT.md docs/CROSS_PLATFORM.md docs/RUSTORE.md .github/workflows/post-release-docs-temp.yml
          git commit -m 'Update documentation for v0.5.4'
          git push
