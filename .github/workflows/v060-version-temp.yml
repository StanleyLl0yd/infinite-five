name: v0.6.0 Version Temp

on:
  push:
    branches:
      - feat/v0.6.0-ux
    paths:
      - .github/workflows/v060-version-temp.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Synchronize version
        run: |
          npm version 0.6.0 --no-git-tag-version
          python3 - <<'PY'
          from pathlib import Path

          replacements = {
              'src-tauri/tauri.conf.json': ('"version": "0.5.4"', '"version": "0.6.0"'),
              'src-tauri/Cargo.toml': ('version = "0.5.4"', 'version = "0.6.0"'),
              'src-tauri/Cargo.lock': ('name = "infinite-five"\nversion = "0.5.4"', 'name = "infinite-five"\nversion = "0.6.0"'),
          }
          for name, (old, new) in replacements.items():
              path = Path(name)
              text = path.read_text()
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{name}: expected one version match, found {count}')
              path.write_text(text.replace(old, new))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit version sync
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock
          git diff --cached --check
          git diff --cached --quiet && exit 1
          git commit -m "Prepare v0.6.0 release metadata"
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:feat/v0.6.0-ux
