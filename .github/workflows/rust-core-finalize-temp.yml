name: Finalize Rust Core Migration

on:
  push:
    branches: [hardening/rust-game-core]
    paths:
      - .github/workflows/rust-core-finalize-temp.yml

permissions:
  contents: write

jobs:
  finalize:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/rust-game-core
      - name: Finalize source and docs
        shell: bash
        run: |
          cargo generate-lockfile --manifest-path crates/game-core/Cargo.toml
          python - <<'PY'
          from pathlib import Path

          def replace_once(path: str, old: str, new: str) -> None:
              file = Path(path)
              text = file.read_text(encoding='utf-8')
              if old not in text:
                  raise SystemExit(f'missing expected text in {path}: {old[:100]!r}')
              file.write_text(text.replace(old, new, 1), encoding='utf-8')

          replace_once(
              'crates/game-core/src/ai.rs',
              'use std::{\n    collections::HashMap,\n    time::{SystemTime, UNIX_EPOCH},\n};',
              'use std::collections::HashMap;\n#[cfg(not(target_arch = "wasm32"))]\nuse std::time::{SystemTime, UNIX_EPOCH};'
          )

          replace_once(
              'README.md',
              'The same TypeScript/Vite application is packaged natively with **Tauri 2**. Native packages bundle the frontend locally instead of using the hosted GitHub Pages site as their primary UI.',
              'The same TypeScript/Vite UI is packaged natively with **Tauri 2**, while board rules, win detection and AI live in one shared Rust core. Web builds execute that core as WebAssembly; native builds call the same Rust implementation through a Tauri command. Native packages bundle the frontend locally instead of using the hosted GitHub Pages site as their primary UI.'
          )
          replace_once(
              'README.md',
              'Native Kotlin/Swift/Rust code stays limited to platform integration such as lifecycle, sharing, haptics, signing, and store updates; game rules and AI remain shared.',
              'Native Kotlin/Swift code stays limited to platform integration such as lifecycle, sharing, haptics, signing, and store updates. Game rules, win detection and AI remain shared in the Rust core instead of being duplicated in TypeScript or platform code.'
          )
          replace_once('README.md', '| Language | TypeScript 7.0 |', '| Languages | TypeScript 7.0 + Rust |')
          replace_once('README.md', '| AI execution | Web Worker |', '| AI execution | Rust core via WebAssembly Web Worker / Tauri command |')
          replace_once(
              'README.md',
              'Game logic remains separate from Canvas rendering and platform-shell concerns so board rules, win detection, local history, sharing, and AI can be tested once and reused across supported targets.',
              'The authoritative Rust game core remains separate from Canvas rendering and platform-shell concerns. TypeScript owns UI orchestration, rendering caches, persistence and sharing, while rules, win detection and AI are tested in Rust and reused across supported targets.'
          )
          replace_once(
              'README.md',
              '''src/\n├── game/\n│   ├── ai.ts              AI evaluation, tactical checks and bounded search\n│   ├── ai-client.ts       asynchronous AI worker client\n│   ├── ai.worker.ts       background AI execution\n│   ├── ai.test.ts         tactical AI regression corpus\n│   ├── ai.lab.test.ts     self-play smoke tests and diagnostics\n│   ├── board.ts           sparse infinite-board state and bounded viewport queries\n│   ├── history.ts         bounded local completed-game history\n│   ├── share.ts           compact game URL encoding\n│   ├── types.ts           game types\n│   └── win.ts             winning-line detection\n├── ui/\n│   └── canvas-board.ts    Canvas rendering, gestures, keyboard input and win animation\n├── i18n.ts                Russian / English interface\n├── main.ts                application state, history, settings, replay and game flow\n├── native-config.test.ts  native identifier and generated Android path regression\n└── styles.css             visual layer, accessibility and responsive layout\n\nsrc-tauri/\n├── src/                    minimal Tauri native shell\n├── capabilities/           native capability policy\n├── gen/android/            generated Android project\n├── icons/                  native platform icons\n├── Cargo.toml / Cargo.lock Rust dependencies\n└── tauri.conf.json         cross-platform native configuration''',
              '''crates/game-core/\n├── src/ai.rs              AI evaluation, tactics and bounded search\n├── src/board.rs           authoritative sparse board state\n├── src/win.rs             winning-line detection\n├── src/types.rs           shared game-core types\n└── src/lib.rs             JSON dispatch API for WebAssembly and Tauri\n\nsrc/\n├── game/\n│   ├── ai.ts              type-only AI compatibility facade\n│   ├── ai-client.ts       asynchronous AI routing\n│   ├── ai.worker.ts       WebAssembly AI worker\n│   ├── core-client.ts     shared Rust-core bridge\n│   ├── core-wasm.ts       browser WebAssembly loader\n│   ├── board.ts           render cache and bounded viewport queries\n│   ├── history.ts         bounded local completed-game history\n│   ├── share.ts           compact game URL encoding\n│   └── types.ts           frontend/shared transport types\n├── ui/\n│   └── canvas-board.ts    Canvas rendering, gestures, keyboard input and win animation\n├── i18n.ts                Russian / English interface\n├── main.ts                application state, history, settings, replay and game flow\n├── native-config.test.ts  native identifier and generated Android path regression\n└── styles.css             visual layer, accessibility and responsive layout\n\nsrc-tauri/\n├── src/                    Tauri shell and Rust-core command bridge\n├── capabilities/           native capability policy\n├── gen/android/            generated Android project\n├── icons/                  native platform icons\n├── Cargo.toml / Cargo.lock Rust dependencies\n└── tauri.conf.json         cross-platform native configuration'''
          )
          replace_once(
              'README.md',
              '- Node.js 22 or another version supported by the current Vite release;\n- npm.',
              '- Node.js 22 or another version supported by the current Vite release;\n- npm;\n- a current stable Rust toolchain. Production web builds also require Binaryen (`wasm-opt`).'
          )

          replace_once(
              'README_RU.md',
              'Та же TypeScript/Vite-реализация упаковывается нативно через **Tauri 2**. Нативные пакеты содержат frontend внутри приложения и не используют GitHub Pages как основной интерфейс.',
              'Тот же TypeScript/Vite-интерфейс упаковывается нативно через **Tauri 2**, а правила поля, проверка победы и AI находятся в едином Rust core. В Web этот core выполняется как WebAssembly, а нативные сборки вызывают ту же Rust-реализацию через Tauri command. Нативные пакеты содержат frontend внутри приложения и не используют GitHub Pages как основной интерфейс.'
          )
          replace_once(
              'README_RU.md',
              'Kotlin/Swift/Rust-код используется только для платформенных интеграций: lifecycle, share, haptics, подпись, store updates и подобное. Правила игры и AI остаются общими.',
              'Kotlin/Swift-код используется только для платформенных интеграций: lifecycle, share, haptics, подпись, store updates и подобное. Правила игры, проверка победы и AI остаются общими в Rust core и не дублируются в TypeScript или платформенном коде.'
          )
          replace_once('README_RU.md', '| Язык | TypeScript 7.0 |', '| Языки | TypeScript 7.0 + Rust |')
          replace_once('README_RU.md', '| Выполнение AI | Web Worker |', '| Выполнение AI | Rust core через WebAssembly Web Worker / Tauri command |')
          replace_once(
              'README_RU.md',
              'Игровая логика отделена от Canvas-отрисовки и платформенной оболочки, чтобы правила, AI, проверку победы, локальную историю и формат обмена партиями можно было тестировать один раз и использовать на поддерживаемых платформах.',
              'Авторитетный Rust game core отделён от Canvas-отрисовки и платформенной оболочки. TypeScript отвечает за UI, render cache, persistence и sharing, а правила, проверка победы и AI тестируются в Rust и переиспользуются на поддерживаемых платформах.'
          )
          replace_once(
              'README_RU.md',
              '''src/\n├── game/\n│   ├── ai.ts              оценка AI, тактика и ограниченный поиск\n│   ├── ai-client.ts       асинхронный клиент AI worker\n│   ├── ai.worker.ts       фоновый расчёт AI\n│   ├── ai.test.ts         набор тактических AI-регрессий\n│   ├── ai.lab.test.ts     self-play smoke-тесты и диагностика\n│   ├── board.ts           разреженное поле и запросы видимого диапазона\n│   ├── history.ts         ограниченная локальная история партий\n│   ├── share.ts           компактное кодирование партии в URL\n│   ├── types.ts           игровые типы\n│   └── win.ts             проверка победной линии\n├── ui/\n│   └── canvas-board.ts    Canvas, жесты, клавиатура и анимация победы\n├── i18n.ts                русский / английский интерфейс\n├── main.ts                состояние приложения, история, настройки и повтор\n├── native-config.test.ts  regression идентификатора и Android package paths\n└── styles.css             визуальный слой, доступность и адаптивная вёрстка\n\nsrc-tauri/\n├── src/                    минимальная нативная оболочка Tauri\n├── capabilities/           политика нативных разрешений Tauri\n├── gen/android/            сгенерированный Android-проект\n├── icons/                  нативные иконки платформ\n├── Cargo.toml / Cargo.lock Rust-зависимости\n└── tauri.conf.json         кроссплатформенная конфигурация Tauri''',
              '''crates/game-core/\n├── src/ai.rs              оценка AI, тактика и ограниченный поиск\n├── src/board.rs           авторитетное разреженное состояние поля\n├── src/win.rs             проверка победной линии\n├── src/types.rs           общие типы game core\n└── src/lib.rs             JSON dispatch API для WebAssembly и Tauri\n\nsrc/\n├── game/\n│   ├── ai.ts              type-only compatibility facade AI\n│   ├── ai-client.ts       асинхронная маршрутизация AI\n│   ├── ai.worker.ts       WebAssembly AI worker\n│   ├── core-client.ts     общий bridge к Rust core\n│   ├── core-wasm.ts       загрузчик WebAssembly для браузера\n│   ├── board.ts           render cache и запросы видимого диапазона\n│   ├── history.ts         ограниченная локальная история партий\n│   ├── share.ts           компактное кодирование партии в URL\n│   └── types.ts           frontend/transport типы\n├── ui/\n│   └── canvas-board.ts    Canvas, жесты, клавиатура и анимация победы\n├── i18n.ts                русский / английский интерфейс\n├── main.ts                состояние приложения, история, настройки и повтор\n├── native-config.test.ts  regression идентификатора и Android package paths\n└── styles.css             визуальный слой, доступность и адаптивная вёрстка\n\nsrc-tauri/\n├── src/                    оболочка Tauri и command bridge к Rust core\n├── capabilities/           политика нативных разрешений Tauri\n├── gen/android/            сгенерированный Android-проект\n├── icons/                  нативные иконки платформ\n├── Cargo.toml / Cargo.lock Rust-зависимости\n└── tauri.conf.json         кроссплатформенная конфигурация Tauri'''
          )
          replace_once(
              'README_RU.md',
              '- Node.js 22 или другая версия, поддерживаемая текущим Vite;\n- npm.',
              '- Node.js 22 или другая версия, поддерживаемая текущим Vite;\n- npm;\n- актуальный стабильный Rust toolchain. Для production Web-сборки также нужен Binaryen (`wasm-opt`).'
          )

          replace_once(
              'docs/AI_LAB.md',
              '3. add the smallest deterministic case to `src/game/ai.test.ts`;',
              '3. add the smallest deterministic case to the Rust core test suite in `crates/game-core/src/ai.rs` or `crates/game-core/src/lib.rs`;'
          )
          replace_once(
              'docs/AI_LAB.md',
              '`chooseAiMove` accepts an optional diagnostics object for test and profiling use. Expert can report:',
              'The Rust core AI response includes diagnostics for test and profiling use. Expert can report:'
          )

          replace_once(
              'docs/CROSS_PLATFORM.md',
              'Infinite Five keeps one TypeScript/Vite game implementation and uses Tauri 2 as the native application shell. The browser/PWA build remains a first-class target; native packaging must reuse the same game rules, AI, rendering, replay, history and localization code rather than creating platform-specific game engines.',
              'Infinite Five keeps one TypeScript/Vite application layer and one authoritative Rust game core, with Tauri 2 as the native application shell. The browser/PWA build remains a first-class target: the Rust core is compiled to WebAssembly for web use, while native packages call the same Rust implementation directly through Tauri. Rendering, replay, history and localization remain shared TypeScript code rather than platform-specific implementations.'
          )
          replace_once(
              'docs/CROSS_PLATFORM.md',
              '''Shared TypeScript/Vite application\n├── Web / PWA -> GitHub Pages\n└── Tauri 2\n    ├── Android -> RuStore first, Google Play later if available\n    ├── macOS -> direct distribution first, store distribution optional later\n    └── iOS -> TestFlight / App Store when distribution access is available''',
              '''Shared TypeScript/Vite UI + Rust game core\n├── Web / PWA -> Rust core as WebAssembly -> GitHub Pages\n└── Tauri 2 -> Rust core directly\n    ├── Android -> RuStore first, Google Play later if available\n    ├── macOS -> direct distribution first, store distribution optional later\n    └── iOS -> TestFlight / App Store when distribution access is available'''
          )
          replace_once(
              'docs/CROSS_PLATFORM.md',
              'Any later RuStore-specific SDK integration must stay isolated in the Android/Kotlin native layer so the shared TypeScript game remains store-neutral.',
              'Any later RuStore-specific SDK integration must stay isolated in the Android/Kotlin native layer so the shared TypeScript UI and Rust game core remain store-neutral.'
          )
          replace_once(
              'docs/CROSS_PLATFORM.md',
              '- Canvas rendering and Web Worker AI;',
              '- Canvas rendering and the shared Rust game core through the target-specific bridge;'
          )

          replace_once(
              'docs/PRODUCT.md',
              'Infinite Five is a minimal five-in-a-row game played on an unbounded square grid. The product should feel immediate, clean and equally natural on desktop and mobile. The TypeScript/Vite implementation is the shared game implementation for the browser and native application shells so platform expansion does not create separate game engines.',
              'Infinite Five is a minimal five-in-a-row game played on an unbounded square grid. The product should feel immediate, clean and equally natural on desktop and mobile. TypeScript/Vite provides the shared application and rendering layer, while one authoritative Rust core implements board rules, win detection and AI for both browser and native shells so platform expansion does not create separate game engines.'
          )
          replace_once(
              'docs/PRODUCT.md',
              '- TypeScript for shared application and game logic.\n- HTML5 Canvas for board rendering and input.\n- Web Worker for non-blocking AI calculation.',
              '- TypeScript for shared application orchestration, rendering, persistence and sharing.\n- Rust for authoritative board rules, win detection and AI.\n- HTML5 Canvas for board rendering and input.\n- WebAssembly in a Web Worker for non-blocking browser AI calculation; native builds call the same Rust core through Tauri.'
          )
          replace_once(
              'docs/PRODUCT.md',
              '- Rust for the minimal shared Tauri shell; Kotlin/Swift only for native integrations that actually require them.\n- Vitest for game, history, sharing, locale, native identity and AI regression tests.',
              '- Tauri 2 / Rust for the native shell and native bridge to the same game core; Kotlin/Swift only for native integrations that actually require them.\n- Cargo tests for game-core and AI regressions, plus Vitest for frontend state, history, sharing, locale and native-identity regressions.'
          )
          replace_once(
              'docs/PRODUCT.md',
              'Game rules, AI evaluation, local history and sharing formats must remain independent from rendering and browser/native shell concerns where practical so the same implementation serves every target.',
              'The Rust rules/AI core, local history and sharing formats must remain independent from rendering and browser/native shell concerns where practical so the same implementations serve every target.'
          )
          PY
          rm .github/workflows/rust-core-finalize-temp.yml
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add crates/game-core/Cargo.lock crates/game-core/src/ai.rs README.md README_RU.md docs/AI_LAB.md docs/CROSS_PLATFORM.md docs/PRODUCT.md .github/workflows/rust-core-finalize-temp.yml
          git commit -m "Finalize Rust core migration documentation"
          git push origin HEAD:hardening/rust-game-core
