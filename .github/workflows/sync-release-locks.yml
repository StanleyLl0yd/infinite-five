name: Sync release lock metadata

on:
  push:
    branches:
      - release/v0.5.2-rustore
    paths:
      - .github/workflows/sync-release-locks.yml

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Sync lock metadata
        shell: bash
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          version = json.loads(Path('package.json').read_text())['version']

          package_lock = Path('package-lock.json')
          package_text = package_lock.read_text()
          old_package_version = '"version": "0.5.1"'
          if package_text.count(old_package_version) < 2:
              raise SystemExit('Expected package-lock root version markers were not found')
          package_lock.write_text(package_text.replace(old_package_version, f'"version": "{version}"', 2))

          cargo_lock = Path('src-tauri/Cargo.lock')
          cargo_text = cargo_lock.read_text()
          old_cargo_version = 'name = "infinite-five"\nversion = "0.5.1"'
          if old_cargo_version not in cargo_text:
              raise SystemExit('Expected Cargo.lock package version marker was not found')
          cargo_lock.write_text(cargo_text.replace(old_cargo_version, f'name = "infinite-five"\nversion = "{version}"', 1))
          PY

          git diff --check
          git add package-lock.json src-tauri/Cargo.lock
          if git diff --cached --quiet; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync v0.5.2 lockfile metadata"
          git push
