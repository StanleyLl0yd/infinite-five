name: Strict TypeScript Unused Scan Temp

on:
  push:
    branches:
      - audit/full-refactor-v0.5.4
    paths:
      - .github/workflows/unused-ts-temp.yml

permissions:
  contents: read

jobs:
  scan:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Check unused locals and parameters
        run: npx tsc --noEmit --noUnusedLocals --noUnusedParameters
