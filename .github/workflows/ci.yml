name: CI

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "11 4 * * 1"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Configure Rust WebAssembly target
        run: rustup target add wasm32-unknown-unknown

      - name: Test Rust game core
        run: cargo test --manifest-path crates/game-core/Cargo.toml

      - name: Lint Rust game core
        run: cargo clippy --manifest-path crates/game-core/Cargo.toml --all-targets -- -D warnings

      - name: Check Rust formatting
        run: cargo fmt --manifest-path crates/game-core/Cargo.toml -- --check

      - name: Install Binaryen
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends binaryen
          wasm-opt --version

      - name: Build and verify production bundle
        run: npm run build
