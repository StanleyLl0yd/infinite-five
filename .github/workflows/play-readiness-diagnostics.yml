name: Play Readiness Diagnostics (temporary)

on:
  pull_request:
    paths:
      - .github/workflows/play-readiness-diagnostics.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  npm-lock-measurement:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
      - name: Resolve security-only npm lock updates on ephemeral runner
        run: |
          npm audit fix --package-lock-only --ignore-scripts
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          const data = JSON.parse(readFileSync('package-lock.json', 'utf8'));
          for (const key of [
            'node_modules/brace-expansion',
            'node_modules/filelist/node_modules/brace-expansion',
            'node_modules/fast-uri',
            'node_modules/serialize-javascript',
            'node_modules/source-map-js'
          ]) {
            console.log('REVIEWED_PACKAGE ' + JSON.stringify({ path: key, package: data.packages[key] }));
          }
          JS
          npm audit --audit-level=high

  semgrep-digest-measurement:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 5
    steps:
      - name: Read byte-exact current Semgrep pack digests without executing them
        shell: bash
        run: |
          for pack in security-audit secrets; do
            for attempt in 1 2 3; do
              tmp="$(mktemp)"
              curl --fail --location --silent --show-error --retry 2 \
                -H 'Accept: application/json' \
                -H 'User-Agent: infinite-five-ci' \
                -o "$tmp" "https://semgrep.dev/c/p/$pack"
              printf 'SEMGREP_DIGEST %s %s %s\n' "$pack" "$attempt" "$(shasum -a 256 "$tmp" | awk '{print $1}')"
              rm -f "$tmp"
            done
          done
