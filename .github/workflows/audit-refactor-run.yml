name: Run audit refactor

on:
  push:
    branches:
      - refactor/full-repository-audit
    paths:
      - .github/workflows/audit-refactor-run.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Apply cleanups
        run: python .github/audit_refactor.py

      - name: Install dependencies
        run: npm ci

      - name: Verify refactor
        run: |
          git diff --check
          npm audit --audit-level=high
          npm test
          npm run typecheck
          npm run build

      - name: Commit verified changes
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "Simplify audited runtime and workflows"
          git push origin HEAD:refactor/full-repository-audit
