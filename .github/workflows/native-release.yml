name: Native Release

on:
  push:
    branches: [main]
    paths:
      - package.json

permissions: {}

concurrency:
  group: native-release
  cancel-in-progress: false

jobs:
  preflight:
    name: Native release preflight
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    outputs:
      should_build: ${{ steps.release.outputs.should_build }}
      tag: ${{ steps.release.outputs.tag }}
      version: ${{ steps.release.outputs.version }}
      source_sha: ${{ steps.release.outputs.source_sha }}
      release_id: ${{ steps.release.outputs.release_id }}
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version

      - name: Prepare draft release
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(node -p "require('./package.json').version")"
          TAG="v$VERSION"
          SOURCE_SHA="$(git rev-parse HEAD)"
          SHOULD_BUILD=true
          RELEASE_ID=""
          TAG_SHA=""
          if ! TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha 2>/dev/null)"; then
            TAG_SHA=""
          fi

          PUBLISHED_JSON=""
          if PUBLISHED_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" 2>/dev/null)"; then
            PUBLISHED_ID="$(jq -r '.id' <<<"$PUBLISHED_JSON")"
            PUBLISHED_TARGET="$(jq -r '.target_commitish' <<<"$PUBLISHED_JSON")"
            test "$(jq -r '.draft' <<<"$PUBLISHED_JSON")" = "false"
            test "$(jq -r '.immutable' <<<"$PUBLISHED_JSON")" = "true"
            test -n "$TAG_SHA"
            test "$PUBLISHED_TARGET" = "$TAG_SHA"
            RELEASE_ID="$PUBLISHED_ID"
            SHOULD_BUILD=false
          else
            if [[ -n "$TAG_SHA" && "$TAG_SHA" != "$SOURCE_SHA" ]]; then
              echo "Orphan release tag $TAG belongs to another source commit: $TAG_SHA" >&2
              exit 1
            fi

            RELEASES_FILE="$RUNNER_TEMP/releases.json"
            gh api "repos/$GITHUB_REPOSITORY/releases?per_page=100" --paginate --slurp > "$RELEASES_FILE"
            DRAFT_COUNT="$(jq --arg tag "$TAG" '[.[][] | select(.draft == true and .tag_name == $tag)] | length' "$RELEASES_FILE")"
            if [[ "$DRAFT_COUNT" -gt 1 ]]; then
              echo "Multiple draft releases claim $TAG; refusing ambiguous release recovery." >&2
              exit 1
            fi

            if [[ "$DRAFT_COUNT" == "1" ]]; then
              RELEASE_ID="$(jq -r --arg tag "$TAG" '.[][] | select(.draft == true and .tag_name == $tag) | .id' "$RELEASES_FILE")"
              DRAFT_TARGET="$(jq -r --arg tag "$TAG" '.[][] | select(.draft == true and .tag_name == $tag) | .target_commitish' "$RELEASES_FILE")"
              DRAFT_ASSET_COUNT="$(jq -r --arg tag "$TAG" '.[][] | select(.draft == true and .tag_name == $tag) | (.assets | length)' "$RELEASES_FILE")"
              DRAFT_AUTHOR="$(jq -r --arg tag "$TAG" '.[][] | select(.draft == true and .tag_name == $tag) | .author.login' "$RELEASES_FILE")"
              test "$DRAFT_AUTHOR" = "github-actions[bot]"

              if [[ "$DRAFT_TARGET" != "$SOURCE_SHA" ]]; then
                if [[ "$DRAFT_ASSET_COUNT" != "0" ]]; then
                  echo "Draft $TAG already has assets for source $DRAFT_TARGET; refusing to retarget it to $SOURCE_SHA." >&2
                  exit 1
                fi
                gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" \
                  -f target_commitish="$SOURCE_SHA" \
                  --silent
              fi
            else
              CREATED_JSON="$(gh api --method POST "repos/$GITHUB_REPOSITORY/releases" \
                -f tag_name="$TAG" \
                -f target_commitish="$SOURCE_SHA" \
                -f name="Infinite Five $TAG" \
                -F draft=true \
                -F prerelease=false \
                -F generate_release_notes=true)"
              RELEASE_ID="$(jq -r '.id' <<<"$CREATED_JSON")"
            fi

            DRAFT_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
            test "$(jq -r '.tag_name' <<<"$DRAFT_JSON")" = "$TAG"
            test "$(jq -r '.target_commitish' <<<"$DRAFT_JSON")" = "$SOURCE_SHA"
            test "$(jq -r '.name' <<<"$DRAFT_JSON")" = "Infinite Five $TAG"
            test "$(jq -r '.draft' <<<"$DRAFT_JSON")" = "true"
            test "$(jq -r '.prerelease' <<<"$DRAFT_JSON")" = "false"
            test "$(jq -r '.immutable' <<<"$DRAFT_JSON")" = "false"
          fi

          echo "should_build=$SHOULD_BUILD" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "source_sha=$SOURCE_SHA" >> "$GITHUB_OUTPUT"
          echo "release_id=$RELEASE_ID" >> "$GITHUB_OUTPUT"

  android:
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    name: Signed Android AAB and supplemental APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      ANDROID_BUILD_TOOLS_VERSION: '35.0.0'
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Set up pinned Android JDK
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          distribution: temurin
          java-version-file: .java-version
          check-latest: false

      - name: Verify Android JDK
        run: |
          EXPECTED_JAVA_VERSION="$(tr -d '\r\n' < .java-version)"
          EXPECTED_JAVA_MAJOR="${EXPECTED_JAVA_VERSION%%.*}"
          test -n "$EXPECTED_JAVA_VERSION"
          test -n "$JAVA_HOME"
          test "$(command -v java)" = "$JAVA_HOME/bin/java"
          java -XshowSettings:properties -version 2>&1 | tee "$RUNNER_TEMP/java-version.txt"
          grep -F "java.vendor = Eclipse Adoptium" "$RUNNER_TEMP/java-version.txt"
          grep -F "java.specification.version = $EXPECTED_JAVA_MAJOR" "$RUNNER_TEMP/java-version.txt"
          grep -F "OpenJDK Runtime Environment Temurin-" "$RUNNER_TEMP/java-version.txt"

      - name: Verify Android SDK Platform 36
        run: bash scripts/verify-android-sdk-platform.sh

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Rust toolchain
        run: python3 scripts/install-rust-toolchain.py

      - name: Configure Android SDK, NDK and Rust targets
        run: |
          NDK_VERSION="29.0.14206865"
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          if [[ ! -d "$NDK_PATH" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          if [[ ! -d "$BUILD_TOOLS_PATH" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;$ANDROID_BUILD_TOOLS_VERSION"
          fi
          test -d "$NDK_PATH"
          test -x "$BUILD_TOOLS_PATH/zipalign"
          test -x "$BUILD_TOOLS_PATH/apksigner"
          test -x "$BUILD_TOOLS_PATH/aapt"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Test Rust game core
        run: npm run test:core

      - name: Load canonical Android signing identities
        run: |
          node - <<'NODE' >> "$GITHUB_ENV"
          const { readFileSync } = require('node:fs');
          const identities = JSON.parse(readFileSync('.github/android-signing-identities.json', 'utf8'));
          const values = {
            ANDROID_APP_CERT_SHA256: identities.applicationSigningCertificateSha256,
            ANDROID_UPLOAD_CERT_SHA256: identities.uploadCertificateSha256,
          };
          for (const [name, value] of Object.entries(values)) {
            if (typeof value !== 'string' || !/^[0-9a-f]{64}$/.test(value)) {
              throw new Error(`Invalid canonical Android signing fingerprint: ${name}`);
            }
            console.log(`${name}=${value}`);
          }
          NODE

      - name: Restore and verify Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_APP_KEY_ALIAS: ${{ secrets.ANDROID_APP_KEY_ALIAS }}
          ANDROID_APP_KEY_PASSWORD: ${{ secrets.ANDROID_APP_KEY_PASSWORD }}
          ANDROID_UPLOAD_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_UPLOAD_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_BASE64"
          test -n "$ANDROID_KEYSTORE_PASSWORD"
          test -n "$ANDROID_APP_KEY_ALIAS"
          test -n "$ANDROID_APP_KEY_PASSWORD"
          test -n "$ANDROID_APP_CERT_SHA256"
          test -n "$ANDROID_UPLOAD_KEY_ALIAS"
          test -n "$ANDROID_UPLOAD_KEY_PASSWORD"
          test -n "$ANDROID_UPLOAD_CERT_SHA256"
          KEYSTORE_PATH="$RUNNER_TEMP/infinite-five.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          check_cert() {
            local alias="$1"
            local expected="$2"
            local actual
            actual="$(keytool -list -v -keystore "$KEYSTORE_PATH" -storepass "$ANDROID_KEYSTORE_PASSWORD" -alias "$alias" 2>/dev/null | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            expected="$(printf '%s' "$expected" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
            test -n "$actual"
            test "$actual" = "$expected"
          }

          check_cert "$ANDROID_APP_KEY_ALIAS" "$ANDROID_APP_CERT_SHA256"
          check_cert "$ANDROID_UPLOAD_KEY_ALIAS" "$ANDROID_UPLOAD_CERT_SHA256"

      - name: Build signed AAB
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_UPLOAD_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD KEYSTORE_PATH
          python - <<'PY'
          import os
          from pathlib import Path

          def prop(value: str) -> str:
              return value.replace('\\', '\\\\').replace('\r', '\\r').replace('\n', '\\n').replace('=', '\\=').replace(':', '\\:')

          Path('src-tauri/gen/android/keystore.properties').write_text('\n'.join([
              f"storePassword={prop(os.environ['ANDROID_KEYSTORE_PASSWORD'])}",
              f"keyPassword={prop(os.environ['ANDROID_KEY_PASSWORD'])}",
              f"keyAlias={prop(os.environ['ANDROID_KEY_ALIAS'])}",
              f"storeFile={prop(os.environ['KEYSTORE_PATH'])}",
              '',
          ]), encoding='utf-8')
          PY
          npm run tauri android build -- --aab --target aarch64 --target armv7
          mkdir -p release
          AAB="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*release*.aab' -print -quit)"
          test -f "$AAB"
          cp "$AAB" "release/Infinite-Five-v${VERSION}-Android.aab"

      - name: Build supplemental signed APK
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_APP_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_APP_KEY_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD KEYSTORE_PATH
          python - <<'PY'
          import os
          from pathlib import Path

          def prop(value: str) -> str:
              return value.replace('\\', '\\\\').replace('\r', '\\r').replace('\n', '\\n').replace('=', '\\=').replace(':', '\\:')

          Path('src-tauri/gen/android/keystore.properties').write_text('\n'.join([
              f"storePassword={prop(os.environ['ANDROID_KEYSTORE_PASSWORD'])}",
              f"keyPassword={prop(os.environ['ANDROID_KEY_PASSWORD'])}",
              f"keyAlias={prop(os.environ['ANDROID_KEY_ALIAS'])}",
              f"storeFile={prop(os.environ['KEYSTORE_PATH'])}",
              '',
          ]), encoding='utf-8')
          PY
          npm run tauri android build -- --apk --target aarch64 --target armv7
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*release*.apk' -print -quit)"
          test -f "$APK"
          cp "$APK" "release/Infinite-Five-v${VERSION}-Android.apk"

      - name: Verify Android artifacts
        run: |
          APK="release/Infinite-Five-v${VERSION}-Android.apk"
          AAB="release/Infinite-Five-v${VERSION}-Android.aab"
          BUILD_TOOLS_PATH="$ANDROID_HOME/build-tools/$ANDROID_BUILD_TOOLS_VERSION"
          APKSIGNER="$BUILD_TOOLS_PATH/apksigner"
          AAPT="$BUILD_TOOLS_PATH/aapt"
          test -x "$APKSIGNER"
          test -x "$AAPT"
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          BADGING="$("$AAPT" dump badging "$APK")"
          grep -F "package: name='com.sl.infinitefive'" <<<"$BADGING"
          grep -F "versionName='${VERSION}'" <<<"$BADGING"
          VERSION_CODE="$(sed -n "s/.*versionCode='\([0-9][0-9]*\)'.*/\1/p" <<<"$BADGING" | head -n 1)"
          test -n "$VERSION_CODE"
          test "$VERSION_CODE" -gt 0
          grep -F "sdkVersion:'26'" <<<"$BADGING"
          grep -F "targetSdkVersion:'36'" <<<"$BADGING"
          EXPECTED_APK_CERT="$(printf '%s' "$ANDROID_APP_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_APK_CERT="$("$APKSIGNER" verify --print-certs "$APK" | sed -n 's/.*certificate SHA-256 digest: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_APK_CERT" = "$EXPECTED_APK_CERT"
          jarsigner -verify "$AAB"
          EXPECTED_AAB_CERT="$(printf '%s' "$ANDROID_UPLOAD_CERT_SHA256" | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          ACTUAL_AAB_CERT="$(keytool -printcert -jarfile "$AAB" | sed -n 's/.*SHA256: //p' | head -n 1 | tr -d ':' | tr '[:upper:]' '[:lower:]')"
          test "$ACTUAL_AAB_CERT" = "$EXPECTED_AAB_CERT"
          bash scripts/verify-android-native.sh "$AAB" "$APK"

      - name: Remove temporary signing material
        if: always()
        run: rm -f src-tauri/gen/android/keystore.properties "${KEYSTORE_PATH:-}"

      - name: Upload signed Android artifacts
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: infinite-five-signed-android
          path: |
            release/Infinite-Five-v${{ needs.preflight.outputs.version }}-Android.aab
            release/Infinite-Five-v${{ needs.preflight.outputs.version }}-Android.apk
          if-no-files-found: error
          retention-days: 30

  macos:
    needs: preflight
    if: needs.preflight.outputs.should_build == 'true'
    name: Ad-hoc signed universal macOS DMG
    runs-on: macos-15
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      VERSION: ${{ needs.preflight.outputs.version }}
      DEVELOPER_DIR: /Applications/Xcode_16.4.app/Contents/Developer
    steps:
      - name: Checkout release source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ needs.preflight.outputs.source_sha }}
          persist-credentials: false

      - name: Verify Xcode toolchain
        run: |
          test "$(xcodebuild -version | sed -n '1p')" = "Xcode 16.4"
          test "$(xcodebuild -version | sed -n '2p')" = "Build version 16F6"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.5"

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version-file: .node-version
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Install pinned Rust toolchain
        run: python3 scripts/install-rust-toolchain.py

      - name: Configure macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Build ad-hoc signed universal DMG
        env:
          APPLE_SIGNING_IDENTITY: '-'
        run: npm run tauri build -- --bundles dmg --target universal-apple-darwin

      - name: Verify and stage macOS artifact
        run: |
          DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -f "$DMG"
          MOUNT_POINT="$RUNNER_TEMP/infinite-five-dmg"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true' EXIT
          APP="$(find "$MOUNT_POINT" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$APP"
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign -dv --verbose=4 "$APP" 2>&1 | grep -F 'Identifier=com.sl.infinitefive'
          bash scripts/verify-macos-native.sh "$APP"
          hdiutil detach "$MOUNT_POINT"
          trap - EXIT
          mkdir -p release
          cp "$DMG" "release/Infinite-Five-v${VERSION}-macOS-universal.dmg"

      - name: Upload macOS artifact
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: infinite-five-macos
          path: release/*
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish verified native release
    needs: [preflight, android, macos]
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      TAG: ${{ needs.preflight.outputs.tag }}
      VERSION: ${{ needs.preflight.outputs.version }}
      SOURCE_SHA: ${{ needs.preflight.outputs.source_sha }}
      RELEASE_ID: ${{ needs.preflight.outputs.release_id }}
    steps:
      - name: Download workflow artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p release
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name infinite-five-signed-android --dir release
          gh run download "$GITHUB_RUN_ID" --repo "$GITHUB_REPOSITORY" --name infinite-five-macos --dir release

      - name: Create checksums
        working-directory: release
        run: sha256sum Infinite-Five-* > SHA256SUMS.txt

      - name: Upload verified assets to draft release and publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          AAB="Infinite-Five-v${VERSION}-Android.aab"
          APK="Infinite-Five-v${VERSION}-Android.apk"
          DMG="Infinite-Five-v${VERSION}-macOS-universal.dmg"
          CHECKSUMS="SHA256SUMS.txt"

          verify_draft_release() {
            local release_json
            release_json="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
            test "$(jq -r '.tag_name' <<<"$release_json")" = "$TAG"
            test "$(jq -r '.target_commitish' <<<"$release_json")" = "$SOURCE_SHA"
            test "$(jq -r '.draft' <<<"$release_json")" = "true"
            test "$(jq -r '.prerelease' <<<"$release_json")" = "false"
            test "$(jq -r '.immutable' <<<"$release_json")" = "false"
          }

          verify_draft_release
          UNEXPECTED_ASSETS="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
            --jq "[.[] | select(.name != \"$AAB\" and .name != \"$APK\" and .name != \"$DMG\" and .name != \"$CHECKSUMS\")] | length")"
          test "$UNEXPECTED_ASSETS" = "0"

          delete_existing_asset() {
            local name="$1"
            local ids=()
            mapfile -t ids < <(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
              --jq ".[] | select(.name == \"$name\") | .id")
            if [[ "${#ids[@]}" -gt 1 ]]; then
              echo "Multiple draft assets named $name; refusing ambiguous replacement." >&2
              return 1
            fi
            if [[ "${#ids[@]}" == "1" ]]; then
              gh api --method DELETE "repos/$GITHUB_REPOSITORY/releases/assets/${ids[0]}" --silent
            fi
          }

          upload_asset() {
            local path="$1"
            local name="${path##*/}"
            local content_type="application/octet-stream"
            case "$name" in
              *.apk) content_type="application/vnd.android.package-archive" ;;
              *.dmg) content_type="application/x-apple-diskimage" ;;
              *.txt) content_type="text/plain; charset=utf-8" ;;
            esac
            curl --fail-with-body --silent --show-error -L \
              -X POST \
              -H "Accept: application/vnd.github+json" \
              -H "Authorization: Bearer $GH_TOKEN" \
              -H "Content-Type: $content_type" \
              --data-binary "@$path" \
              "https://uploads.github.com/repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?name=$name" \
              >/dev/null
          }

          for name in "$AAB" "$APK" "$DMG" "$CHECKSUMS"; do
            delete_existing_asset "$name"
          done
          upload_asset "release/$AAB"
          upload_asset "release/$APK"
          upload_asset "release/$DMG"
          upload_asset "release/$CHECKSUMS"

          verify_remote_asset() {
            local path="$1"
            local name="${path##*/}"
            local expected="sha256:$(sha256sum "$path" | awk '{print $1}')"
            local actual=""
            for attempt in $(seq 1 12); do
              actual="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" \
                --jq ".[] | select(.name == \"$name\") | .digest")"
              if [[ "$actual" == "$expected" ]]; then
                return 0
              fi
              sleep 5
            done
            echo "GitHub asset digest mismatch for $name: expected $expected, got ${actual:-missing}" >&2
            return 1
          }

          verify_remote_asset "release/$AAB"
          verify_remote_asset "release/$APK"
          verify_remote_asset "release/$DMG"
          verify_remote_asset "release/$CHECKSUMS"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq 'length')" = "4"

          verify_draft_release
          verify_remote_asset "release/$AAB"
          verify_remote_asset "release/$APK"
          verify_remote_asset "release/$DMG"
          verify_remote_asset "release/$CHECKSUMS"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq 'length')" = "4"
          gh api --method PATCH "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID" -F draft=false --silent

          IS_IMMUTABLE=""
          for attempt in $(seq 1 12); do
            PUBLISHED_JSON="$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID")"
            IS_DRAFT="$(jq -r '.draft' <<<"$PUBLISHED_JSON")"
            IS_IMMUTABLE="$(jq -r '.immutable' <<<"$PUBLISHED_JSON")"
            if [[ "$IS_DRAFT" == "false" && "$IS_IMMUTABLE" == "true" ]]; then
              break
            fi
            sleep 5
          done

          TAG_SHA="$(gh api "repos/$GITHUB_REPOSITORY/commits/$TAG" --jq .sha)"
          PUBLISHED_BY_TAG_ID="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq .id)"
          test "$TAG_SHA" = "$SOURCE_SHA"
          test "$PUBLISHED_BY_TAG_ID" = "$RELEASE_ID"
          test "$IS_DRAFT" = "false"
          test "$IS_IMMUTABLE" = "true"
          test "$(gh api "repos/$GITHUB_REPOSITORY/releases/$RELEASE_ID/assets?per_page=100" --jq 'length')" = "4"
          verify_remote_asset "release/$AAB"
          verify_remote_asset "release/$APK"
          verify_remote_asset "release/$DMG"
          verify_remote_asset "release/$CHECKSUMS"

          for attempt in $(seq 1 12); do
            if gh release verify "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              && gh release verify-asset "$TAG" "release/$AAB" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              && gh release verify-asset "$TAG" "release/$APK" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              && gh release verify-asset "$TAG" "release/$DMG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1 \
              && gh release verify-asset "$TAG" "release/$CHECKSUMS" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
              exit 0
            fi
            sleep 5
          done
          echo "Immutable release attestation for $TAG was not verifiable within the wait window." >&2
          exit 1
