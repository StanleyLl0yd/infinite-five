name: Verify final AI formatting

on:
  push:
    branches:
      - refactor/full-repository-audit
    paths:
      - .github/workflows/audit-fix-format.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Fix indentation
        run: |
          python - <<'PY'
          from pathlib import Path
          path = Path('src/game/ai.ts')
          text = path.read_text()
          old = """  const ranked = candidates
          .map((position) => ({ position, score: rankScore(board, position, mark) }))
          .sort((a, b) => b.score - a.score);"""
          new = """  const ranked = candidates
            .map((position) => ({ position, score: rankScore(board, position, mark) }))
            .sort((a, b) => b.score - a.score);"""
          if text.count(old) != 1:
              raise SystemExit('Easy AI indentation changed unexpectedly')
          path.write_text(text.replace(old, new))
          PY

      - name: Install dependencies
        run: npm ci

      - name: Verify
        run: |
          git diff --check
          npm test
          npm run typecheck
          npm run build

      - name: Commit
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/game/ai.ts
          git commit -m "Restore Easy AI indentation"
          git push origin HEAD:refactor/full-repository-audit
