name: Security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
  schedule:
    - cron: "37 4 * * 1"

permissions:
  contents: read

concurrency:
  group: security-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep:
    name: Semgrep
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    container:
      image: semgrep/semgrep:1.172.0@sha256:65dcd4408adda7c183a6b4550cb1e9b19f7f627a6fbb7e0559bd466bedc44d7b
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Download and verify Semgrep Registry rules
        shell: bash
        run: |
          python3 - <<'PY'
          import hashlib
          import os
          from datetime import date
          from pathlib import Path
          from urllib.request import Request, urlopen

          SECURITY_AUDIT_ALLOWED_SHA256 = {
              '83d7cde9157b3c79cc5cfaea26e7bd2ba9c740f2ba07635ad475b2585556c32d',
              '3e280f9214fb2a533fc94c60e318239ebaade31908cd4aa527fe66c75e54dd9d',
          }
          RULESET_B_ALLOWED_SHA256 = {
              'd1afb323ed493cf9d3ee5044447b989debf033b2b7cc8208662a81b8c162c66a',
              'f680ede6ba7af3e63a046c2f2c4d117181630b5308be16b22a48a82636d61b6b',
          }
          DUAL_BASELINE_EXPIRES = date(2026, 10, 23)
          if date.today() > DUAL_BASELINE_EXPIRES:
              raise SystemExit(
                  'Reviewed dual Semgrep Registry baseline expired on '
                  f'{DUAL_BASELINE_EXPIRES.isoformat()}; re-measure both Registry endpoints across runner regions and collapse when converged.'
              )
          configs = (
              ('security-audit', 'https://semgrep.dev/c/p/security-audit', SECURITY_AUDIT_ALLOWED_SHA256),
              ('secrets', 'https://semgrep.dev/c/p/secrets', RULESET_B_ALLOWED_SHA256),
          )
          env_file = Path(os.environ['GITHUB_ENV'])
          temp = Path(os.environ['RUNNER_TEMP'])
          with env_file.open('a', encoding='utf-8') as env:
              for name, url, expected in configs:
                  request = Request(url, headers={'Accept': 'application/json', 'User-Agent': 'infinite-five-ci'})
                  with urlopen(request, timeout=60) as response:
                      data = response.read()
                  actual = hashlib.sha256(data).hexdigest()
                  if actual not in expected:
                      expected_text = ', '.join(sorted(expected))
                      raise SystemExit(
                          f'Semgrep Registry digest mismatch for {name}: expected one of [{expected_text}], got {actual}'
                      )
                  path = temp / f'semgrep-{name}.json'
                  path.write_bytes(data)
                  print(f'Verified Semgrep Registry rules: {name} sha256:{actual}')
                  env_name = 'SEMGREP_' + name.upper().replace('-', '_') + '_CONFIG'
                  env.write(f'{env_name}={path}\n')
          PY

      - name: Run Semgrep CE
        run: semgrep scan --config "$SEMGREP_SECURITY_AUDIT_CONFIG" --config "$SEMGREP_SECRETS_CONFIG" --error --metrics=off .

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout full history
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Scan repository for secrets
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: 'false'

  rustsec:
    name: RustSec
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    env:
      GLIB_UNSOUND_ADVISORY: RUSTSEC-2024-0429
      GLIB_UNSOUND_EXCEPTION_EXPIRES: '2026-12-31'
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install verified cargo-audit
        shell: bash
        run: |
          VERSION="0.22.2"
          ARCHIVE="cargo-audit-x86_64-unknown-linux-gnu-v${VERSION}.tgz"
          URL="https://github.com/RustSec/rustsec/releases/download/cargo-audit/v${VERSION}/${ARCHIVE}"
          curl --fail --location --silent --show-error --output "$RUNNER_TEMP/$ARCHIVE" "$URL"
          printf '%s  %s\n' 'ab28a1bdb54db4d5d8ad5981cf1f959410370b3d28250dbd35f6a44248620e39' "$RUNNER_TEMP/$ARCHIVE" | sha256sum --check --status
          mkdir -p "$RUNNER_TEMP/cargo-audit" "$RUNNER_TEMP/bin"
          tar -xzf "$RUNNER_TEMP/$ARCHIVE" -C "$RUNNER_TEMP/cargo-audit"
          AUDIT_BIN="$(find "$RUNNER_TEMP/cargo-audit" -type f -name cargo-audit -print -quit)"
          test -f "$AUDIT_BIN"
          install -m 0755 "$AUDIT_BIN" "$RUNNER_TEMP/bin/cargo-audit"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"

      - name: Install pinned Rust toolchain
        run: python3 scripts/install-rust-toolchain.py

      - name: Enforce temporary RustSec exception expiry
        shell: bash
        run: |
          python3 - <<'PY'
          import os
          from datetime import date

          advisory = os.environ['GLIB_UNSOUND_ADVISORY']
          expiry = date.fromisoformat(os.environ['GLIB_UNSOUND_EXCEPTION_EXPIRES'])
          today = date.today()
          if today > expiry:
              raise SystemExit(
                  f'Temporary RustSec exception {advisory} expired on {expiry.isoformat()}; '
                  're-evaluate the Tauri/Wry GTK dependency graph before extending or removing it.'
              )
          print(f'Temporary RustSec exception {advisory} valid through {expiry.isoformat()}')
          PY

      - name: Audit Rust game-core dependencies
        run: cargo audit --deny unsound --file crates/game-core/Cargo.lock

      - name: Verify native RustSec exception remains necessary
        shell: bash
        run: |
          set +e
          output="$(cargo audit --deny unsound --file src-tauri/Cargo.lock 2>&1)"
          status=$?
          set -e
          printf '%s\n' "$output"
          if [ "$status" -eq 0 ]; then
            echo "Expected $GLIB_UNSOUND_ADVISORY to require the temporary exception, but the strict audit passed." >&2
            echo "Remove the stale RustSec exception instead of carrying it forward." >&2
            exit 1
          fi
          if ! grep -Fq "$GLIB_UNSOUND_ADVISORY" <<<"$output"; then
            echo "Strict native audit failed without reporting the reviewed $GLIB_UNSOUND_ADVISORY exception." >&2
            exit 1
          fi

      - name: Audit native Rust dependencies
        run: cargo audit --deny unsound --ignore "$GLIB_UNSOUND_ADVISORY" --file src-tauri/Cargo.lock
