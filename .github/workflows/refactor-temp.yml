name: Refactor Temp

on:
  push:
    branches:
      - audit/full-refactor-v0.5.4
    paths:
      - .github/workflows/refactor-temp.yml

permissions:
  contents: write

jobs:
  refactor:
    if: github.event.head_commit.message == 'Fix temporary refactor workflow'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: audit/full-refactor-v0.5.4

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm

      - name: Apply behavior-preserving refactor
        run: python3 .github/refactor-temp.py

      - name: Verify refactor
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build
          test ! -e src/about.ts
          test ! -e src/about.css
          test ! -e .github/refactor-temp.py
          test ! -e .github/workflows/refactor-temp.yml
          test "$(grep -c '<script type="module"' index.html)" -eq 1
          grep -q 'id="aboutDialog"' index.html
          ! grep -R '/src/about.ts' index.html src

      - name: Commit refactor
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git commit -m 'Consolidate application runtime'
          git push
