name: Native

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: native-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android release AAB and APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure Android NDK and Rust targets
        run: |
          NDK_VERSION="29.0.14206865"
          NDK_PATH="$ANDROID_HOME/ndk/$NDK_VERSION"
          if [[ ! -d "$NDK_PATH" ]]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "ndk;$NDK_VERSION"
          fi
          test -d "$NDK_PATH"
          echo "NDK_HOME=$NDK_PATH" >> "$GITHUB_ENV"
          rustup target add aarch64-linux-android armv7-linux-androideabi

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Test Rust game core
        run: npm run test:core

      - name: Build Android release AAB
        run: npm run tauri android build -- --aab --target aarch64 --target armv7

      - name: Build Android release APK
        run: npm run tauri android build -- --apk --target aarch64 --target armv7

      - name: Verify Android package compatibility and hardening
        run: |
          AAB="$(find src-tauri/gen/android/app/build/outputs/bundle -type f -name '*.aab' -print -quit)"
          APK="$(find src-tauri/gen/android/app/build/outputs/apk -type f -name '*.apk' -print -quit)"
          test -f "$AAB"
          test -f "$APK"
          bash scripts/verify-android-native.sh "$AAB" "$APK"

      - name: Upload Android packages
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infinite-five-android-release-packages
          path: |
            src-tauri/gen/android/**/build/outputs/bundle/**/*.aab
            src-tauri/gen/android/**/build/outputs/apk/**/*.apk
          if-no-files-found: error
          retention-days: 14

  macos:
    name: macOS universal release DMG
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Configure macOS Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run frontend tests
        run: npm test

      - name: Build universal macOS DMG
        run: npm run tauri build -- --bundles dmg --target universal-apple-darwin --no-sign

      - name: Verify macOS release artifact
        run: |
          DMG="$(find src-tauri/target/universal-apple-darwin/release/bundle/dmg -type f -name '*.dmg' -print -quit)"
          test -f "$DMG"
          MOUNT_POINT="$RUNNER_TEMP/infinite-five-dmg"
          mkdir -p "$MOUNT_POINT"
          hdiutil attach "$DMG" -nobrowse -readonly -mountpoint "$MOUNT_POINT"
          trap 'hdiutil detach "$MOUNT_POINT" >/dev/null 2>&1 || true' EXIT
          APP="$(find "$MOUNT_POINT" -maxdepth 1 -type d -name '*.app' -print -quit)"
          test -d "$APP"
          bash scripts/verify-macos-native.sh "$APP"
          hdiutil detach "$MOUNT_POINT"
          trap - EXIT

      - name: Upload DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: infinite-five-macos-universal-dmg
          path: src-tauri/target/**/bundle/dmg/*.dmg
          if-no-files-found: error
          retention-days: 14
