name: Regenerate raster icon assets

on:
  push:
    branches: [fix/v0.6.3-original-icon]
    paths:
      - .github/workflows/icon-diagnose.yml

permissions:
  contents: write

jobs:
  regenerate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - run: npm ci
      - name: Regenerate all raster icon assets
        run: npm run prepare:icons

      - name: Verify Android launcher was replaced
        run: |
          set -euxo pipefail
          ANDROID_RES=src-tauri/gen/android/app/src/main/res
          file branding/infinite-five-icon-master.png
          file "$ANDROID_RES/mipmap-xxxhdpi/ic_launcher.png"
          sha256sum branding/infinite-five-icon-master.png
          sha256sum "$ANDROID_RES/mipmap-xxxhdpi/ic_launcher.png"
          test "$(sha256sum "$ANDROID_RES/mipmap-xxxhdpi/ic_launcher.png" | cut -d' ' -f1)" != "1758d7a79da8ccc015f33bd770fe57dabc4c0bb9bc27f4191efe2514295ea87a"
          test ! -d src-tauri/icons/android
          mkdir -p icon-verify
          cp branding/infinite-five-icon-master.png icon-verify/master.png
          cp "$ANDROID_RES/mipmap-xxxhdpi/ic_launcher.png" icon-verify/android-launcher.png
          cp "$ANDROID_RES/mipmap-xxxhdpi/ic_launcher_foreground.png" icon-verify/android-foreground.png
          cp "$ANDROID_RES/mipmap-xxxhdpi/ic_launcher_round.png" icon-verify/android-round.png

      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: regenerated-icon-assets
          path: icon-verify
          if-no-files-found: error
          retention-days: 1

      - name: Commit regenerated raster assets
        run: |
          set -euxo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A src-tauri/icons src-tauri/gen/android/app/src/main/res public docs/assets/rustore
          if git diff --cached --quiet; then
            echo "No regenerated icon changes found" >&2
            exit 1
          fi
          git commit -m "Refresh Android launcher assets from raster master"
          git push
