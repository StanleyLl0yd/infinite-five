name: Fix v0.4.0 history integration

on:
  push:
    branches: [release/0.4.0-accessibility-history]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ !contains(github.event.head_commit.message, '[history-fix-ready]') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: true

      - name: Set up Node.js
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Patch history integration
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/main.ts')
          text = path.read_text()

          def replace_once(old: str, new: str) -> None:
              global text
              if text.count(old) != 1:
                  raise RuntimeError(f'Expected one match, got {text.count(old)}: {old[:80]!r}')
              text = text.replace(old, new, 1)

          replace_once(
              "  parseHistory,\n  serializeHistory,",
              "  parseHistory,\n  removeLatestMatchingHistoryEntry,\n  serializeHistory,"
          )
          replace_once(
              "  const moves = [...board.getMoves()];\n  const id = createHistoryId(moves, winner);\n  if (gameHistory.some((entry) => entry.id === id)) return;",
              "  const moves = [...board.getMoves()];\n  const completedAt = Date.now();\n  const id = createHistoryId(moves, winner, completedAt);"
          )
          replace_once(
              "    completedAt: Date.now(),",
              "    completedAt,"
          )
          replace_once(
              "  const id = createHistoryId(board.getMoves(), winner);\n  const next = gameHistory.filter((entry) => entry.id !== id);",
              "  const next = removeLatestMatchingHistoryEntry(gameHistory, board.getMoves(), winner);"
          )
          replace_once(
              "} else if (winner) {\n  recordResult();\n  recordHistory();\n  saveGame();",
              "} else if (winner) {\n  recordResult();\n  saveGame();"
          )

          path.write_text(text)
          PY

      - name: Install dependencies
        run: npm ci

      - name: Audit dependencies
        run: npm audit --audit-level=high

      - name: Run tests
        run: npm test

      - name: Build production bundle
        run: npm run build

      - name: Commit fix
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add src/main.ts
          git commit -m "Fix repeated-game history recording [history-fix-ready]"
          git push
