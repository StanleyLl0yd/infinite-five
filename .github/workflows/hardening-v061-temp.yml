name: Harden v0.6.1 Rust Core

on:
  push:
    branches: [hardening/v0.6.1-final]
    paths:
      - .github/workflows/hardening-v061-temp.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/v0.6.1-final
      - name: Apply v0.6.1 documentation
        run: python .github/hardening-v061-temp.py
      - name: Validate documentation diff
        run: git diff --check
      - name: Commit documentation
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add README.md README_RU.md SECURITY.md docs/CROSS_PLATFORM.md
          git diff --cached --check
          git commit -m "Document v0.6.1 release hardening"
          git push origin HEAD:hardening/v0.6.1-final
