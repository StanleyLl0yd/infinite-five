name: Harden v0.6.1 Rust Core

on:
  push:
    branches: [hardening/v0.6.1-final]
    paths:
      - .github/workflows/hardening-v061-temp.yml

permissions:
  contents: write

jobs:
  patch-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - name: Checkout hardening branch
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: hardening/v0.6.1-final
      - name: Apply v0.6.1 version state
        run: python .github/hardening-v061-temp.py
      - name: Refresh local package lock metadata
        run: |
          cargo metadata --manifest-path crates/game-core/Cargo.toml --format-version 1 >/dev/null
          cargo metadata --manifest-path src-tauri/Cargo.toml --format-version 1 >/dev/null
      - name: Install frontend dependencies
        run: npm ci
      - name: Run frontend tests
        run: npm test
      - name: Typecheck frontend
        run: npm run typecheck
      - name: Test Rust game core
        run: cargo test --manifest-path crates/game-core/Cargo.toml
      - name: Lint Rust game core
        run: cargo clippy --manifest-path crates/game-core/Cargo.toml --all-targets -- -D warnings
      - name: Commit validated release state
        run: |
          git config user.name "Stanley Lloyd"
          git config user.email "131160519+StanleyLl0yd@users.noreply.github.com"
          git add package.json package-lock.json src-tauri/tauri.conf.json src-tauri/Cargo.toml src-tauri/Cargo.lock crates/game-core/Cargo.toml crates/game-core/Cargo.lock
          git diff --cached --check
          git commit -m "Prepare Infinite Five v0.6.1"
          git push origin HEAD:hardening/v0.6.1-final
