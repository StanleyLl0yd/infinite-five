name: Release Bootstrap

on:
  push:
    branches: [release/v0.5.1-native-artifacts]
    paths:
      - package.json
      - src-tauri/Cargo.toml
      - .github/workflows/release-bootstrap.yml
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-bootstrap-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bootstrap:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Refresh lockfiles
        run: |
          npm install --package-lock-only --ignore-scripts
          cargo generate-lockfile --manifest-path src-tauri/Cargo.toml

      - name: Verify release source
        run: |
          npm ci
          npm audit --audit-level=high
          npm test
          npm run build

      - name: Commit lockfiles
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package-lock.json src-tauri/Cargo.lock
          if ! git diff --cached --quiet; then
            git commit -m "Synchronize v0.5.1 lockfiles"
            git push origin "HEAD:${GITHUB_REF_NAME}"
          fi
